name: Encore Cloud Inspect

# Read-only look at what Encore Cloud holds, for diagnosing sync. Prints only hashed account ids,
# versions, sizes, household names, and profile counts: no emails, profile names, or session keys.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: npx --yes wrangler@4.151.1
    defaults:
      run:
        working-directory: Encore/Cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Query
        run: |
          set -euo pipefail
          id="$($WRANGLER d1 list --json | jq -r '.[] | select(.name == "encore") | .uuid' | head -1)"
          sed -i "s/__D1_DATABASE_ID__/${id}/" wrangler.toml
          q() { $WRANGLER d1 execute encore --remote --json --command "$1" | jq -c '.[0].results[]'; }
          echo "::notice title=households::$(q "SELECT substr(hex(owner_id),1,10) AS acct, version, updated_at, length(doc) AS bytes, json_extract(doc,'\$.name') AS name, json_array_length(json_extract(doc,'\$.profiles')) AS profiles, (SELECT count(*) FROM json_each(json_extract(doc,'\$.libraries'))) AS libs FROM households" | tr '\n' ' ')"
          echo "::notice title=directories::$(q "SELECT substr(hex(owner_id),1,10) AS acct, version, updated_at, json_array_length(json_extract(doc,'\$.households')) AS entries FROM directories" | tr '\n' ' ')"
          echo "::notice title=sessions::$(q "SELECT substr(hex(user_id),1,10) AS acct, count(*) AS sessions, max(expires_at) AS latest FROM sessions GROUP BY user_id" | tr '\n' ' ')"
