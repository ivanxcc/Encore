name: Encore Release

# Two channels, so nobody else is offered an update before you have tried it:
#
#   beta    every push to the `beta` branch (or "Run workflow" with channel beta) builds the apps and
#           publishes them as a GitHub *pre-release* tagged v<version>-beta.<build>. Pre-releases never
#           become "latest", so stable installs are not offered them. The rolling `beta-channel`
#           pre-release holds the beta update manifest that beta builds of the Mac app follow.
#   stable  "Promote to Stable" (encore-promote.yml) republishes a tested beta as the latest release,
#           byte for byte, and moves `main` to that commit. A pushed v* tag also builds straight to stable.
#
# Each release carries the iPhone/iPad and Apple TV IPAs (unsigned; sideloading re-signs them), the
# universal Mac DMG and zip (ad-hoc signed), encore-update.json for the Mac updater, the AltStore /
# SideStore source, and the one-line Mac installer. No secrets are needed.
#
# Versioning: MARKETING_VERSION comes from Encore/project.yml; the build number is the workflow run number.

on:
  push:
    branches: [beta]
    paths: ["Encore/**", ".github/workflows/encore-release.yml", ".github/scripts/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      channel:
        description: "beta: a pre-release for you to test. stable: publish to everyone right away."
        type: choice
        options: [beta, stable]
        default: beta

permissions:
  contents: write
  pull-requests: read   # the merged pull request's summary becomes the release notes

concurrency:
  group: encore-release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
      tag: ${{ steps.v.outputs.tag }}
      channel: ${{ steps.v.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          base="$(grep -m1 'MARKETING_VERSION:' Encore/project.yml | sed -E 's/.*"([^"]+)".*/\1/')"
          build="${{ github.run_number }}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            channel=stable
            tag="${GITHUB_REF#refs/tags/}"
            version="${tag#v}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.channel }}" = "stable" ]; then
            channel=stable; version="${base}"; tag="v${base}-build.${build}"
          else
            channel=beta; version="${base}"; tag="v${base}-beta.${build}"
          fi
          {
            echo "version=${version}"; echo "build=${build}"; echo "tag=${tag}"; echo "channel=${channel}"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Encore ${version} (${build}) -> ${tag} [${channel}]"

  build:
    needs: version
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: iOS
            destination: generic/platform=iOS
            products: Release-iphoneos
          - platform: tvOS
            destination: generic/platform=tvOS
            products: Release-appletvos
          - platform: macOS
            destination: generic/platform=macOS
            products: Release
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD: ${{ needs.version.outputs.build }}
      CHANNEL: ${{ needs.version.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          # Xcode 26 builds with the OS 26 SDKs (Liquid Glass); Xcode 16 is the fallback.
          XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)"
          [ -n "$XCODE" ] || XCODE="$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          echo "::notice::Building with $(xcodebuild -version | head -1) ($XCODE)"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: Encore
        run: xcodegen generate
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: Encore/build/SourcePackages
          key: spm-release-${{ github.repository }}-${{ runner.os }}-${{ hashFiles('Encore/project.yml') }}
      - name: Resolve Swift packages
        working-directory: Encore
        run: |
          set -o pipefail
          # Package downloads are the flakiest part of a build; retry them on their own.
          for attempt in 1 2 3; do
            xcodebuild -resolvePackageDependencies -project Encore.xcodeproj -scheme "Encore-${{ matrix.platform }}" \
              -clonedSourcePackagesDirPath build/SourcePackages -skipPackagePluginValidation 2>&1 | tail -20 && exit 0
            echo "::warning::Package resolution attempt $attempt failed; retrying"
            rm -rf build/SourcePackages
            sleep $((attempt * 15))
          done
          echo "::error::Could not resolve Swift packages after 3 attempts"; exit 1
      - name: Build Encore for ${{ matrix.platform }}
        working-directory: Encore
        run: |
          set -o pipefail
          EXTRA=()
          if [ "${{ matrix.platform }}" = "macOS" ]; then EXTRA=(ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO); fi
          xcodebuild -project Encore.xcodeproj -scheme "Encore-${{ matrix.platform }}" \
            -configuration Release -destination "${{ matrix.destination }}" \
            -derivedDataPath build -clonedSourcePackagesDirPath build/SourcePackages \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" "${EXTRA[@]}" \
            ENCORE_REPOSITORY="${{ github.repository }}" ENCORE_CLOUD_URL="${{ vars.ENCORE_CLOUD_URL }}" ENCORE_CHANNEL="$CHANNEL" \
            -quiet build 2>&1 | tee build.log || { grep -E "error:" build.log | sort -u | head -30 | sed 's/^/::error::/'; tail -15 build.log | sed 's/^/::error::/'; exit 1; }
      - name: Package
        working-directory: Encore
        run: |
          set -euo pipefail
          APP="build/Build/Products/${{ matrix.products }}/Encore.app"
          test -d "$APP" || { echo "::error::$APP missing"; exit 1; }
          mkdir -p out
          case "${{ matrix.platform }}" in
            iOS|tvOS)
              rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
              (zip -qry "out/Encore-${{ matrix.platform }}-${VERSION}.ipa" Payload)
              ;;
            macOS)
              archs="$(lipo -archs "$APP/Contents/MacOS/Encore")"
              echo "Encore.app architectures: $archs"
              [[ " $archs " == *" arm64 "* && " $archs " == *" x86_64 "* ]] || { echo "::error::Mac app is not universal"; exit 1; }
              # Ad-hoc sign the whole bundle so it launches on Apple silicon without a Developer ID.
              codesign --force --deep --sign - "$APP"
              codesign --verify --deep --strict "$APP"
              rm -rf dmg && mkdir dmg && cp -R "$APP" dmg/ && ln -s /Applications dmg/Applications
              hdiutil create -volname Encore -srcfolder dmg -format UDZO "out/Encore-macOS-${VERSION}.dmg"
              # The in-place updater downloads this zip (smaller and simpler to unpack than a DMG).
              ditto -c -k --keepParent "$APP" "out/Encore-macOS-${VERSION}.zip"
              ;;
          esac
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: encore-${{ matrix.platform }}
          path: Encore/out/*

  release:
    needs: [version, build]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD: ${{ needs.version.outputs.build }}
      TAG: ${{ needs.version.outputs.tag }}
      CHANNEL: ${{ needs.version.outputs.channel }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write manifests
        run: |
          .github/scripts/release-notes.sh "$GITHUB_SHA" > notes.txt
          .github/scripts/write-manifests.sh dist "$TAG" "$VERSION" "$BUILD" "$CHANNEL" notes.txt
      - name: Publish ${{ needs.version.outputs.channel }} release
        run: |
          set -euo pipefail
          ls -la dist
          if [ "$CHANNEL" = "stable" ]; then
            gh release create "$TAG" dist/* -R "$REPO" --target "$GITHUB_SHA" \
              --title "Encore ${VERSION} (build ${BUILD})" --generate-notes --latest
            exit 0
          fi
          PROMOTE="https://github.com/${REPO}/actions/workflows/encore-promote.yml"
          {
            echo "**Beta build for testing.** Only beta installs are offered this build."
            echo
            echo "When you are happy with it, ship it to everyone: [Promote to Stable](${PROMOTE}) › Run workflow."
            echo
            echo "Mac (beta channel): \`curl -fsSL https://github.com/${REPO}/releases/download/beta-channel/install-mac.sh | ENCORE_CHANNEL=beta bash\`"
            echo
            echo "### Changes"
            cat notes.txt
          } > body.md
          gh release create "$TAG" dist/* -R "$REPO" --target "$GITHUB_SHA" \
            --title "Encore ${VERSION} beta (build ${BUILD})" --notes-file body.md --prerelease --latest=false
          # The rolling pre-release beta Mac apps (and the beta installer) read.
          gh release delete beta-channel -R "$REPO" --cleanup-tag --yes 2>/dev/null || true
          gh release create beta-channel -R "$REPO" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Encore beta channel" \
            --notes "Always points at the newest beta build (currently ${TAG}). Beta builds of the Mac app check here for updates." \
            dist/encore-update.json dist/install-mac.sh dist/altstore-source.json dist/icon.png
          echo "::notice::Beta ${TAG} is published. Promote it: ${PROMOTE}"

  # Optional: an Approve button instead of running "Promote to Stable" by hand. Create an environment
  # named "stable" with yourself as a required reviewer and set the repository variable
  # ENCORE_RELEASE_APPROVAL=true; GitHub then asks you to approve each beta (email, app, or web).
  approve:
    needs: [version, release]
    if: needs.version.outputs.channel == 'beta' && vars.ENCORE_RELEASE_APPROVAL == 'true'
    runs-on: ubuntu-24.04
    environment: stable
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promote ${{ needs.version.outputs.tag }} to stable
        run: .github/scripts/promote.sh "${{ needs.version.outputs.tag }}"
