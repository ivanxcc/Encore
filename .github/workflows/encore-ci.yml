name: Encore

# Builds the Encore apps from public sources only: no secrets, no private engine.
#  - engine: EncoreKit's tests on Linux (fast, cheap, catches protocol/ranking/household regressions).
#  - apps:   unsigned iOS, tvOS, and universal macOS builds on a macOS runner. The macOS .app is uploaded
#            as an artifact, and its executable must contain both arm64 and x86_64.

# Runs once per change, on its pull request. Not on pushes: a push to a branch with an open pull request
# used to build everything twice (the push and the pull request), and a push to beta builds again in
# Encore Release anyway. Changes only to the Cloud Worker don't rebuild the apps (encore-cloud.yml).
on:
  pull_request:
    paths: ["Encore/**", "!Encore/Cloud/**", ".github/workflows/encore-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the pull request cancels the build of the one before it.
concurrency:
  group: encore-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    runs-on: ubuntu-24.04
    container: swift:6.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test EncoreKit
        working-directory: Encore/Packages/EncoreKit
        run: swift test

  apps:
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: Encore-iOS
            destination: generic/platform=iOS Simulator
          - scheme: Encore-tvOS
            destination: generic/platform=tvOS Simulator
          - scheme: Encore-macOS
            destination: generic/platform=macOS
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          # Xcode 26 builds with the OS 26 SDKs (Liquid Glass); Xcode 16 is the fallback.
          XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)"
          [ -n "$XCODE" ] || XCODE="$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          echo "::notice::Building with $(xcodebuild -version | head -1) ($XCODE)"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: Encore
        run: xcodegen generate
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: Encore/build/SourcePackages
          key: spm-${{ github.repository }}-${{ runner.os }}-${{ hashFiles('Encore/project.yml') }}
      - name: Resolve Swift packages
        working-directory: Encore
        run: |
          set -o pipefail
          # Package downloads are the flakiest part of a build; retry them on their own.
          for attempt in 1 2 3; do
            xcodebuild -resolvePackageDependencies -project Encore.xcodeproj -scheme "${{ matrix.scheme }}" \
              -clonedSourcePackagesDirPath build/SourcePackages -skipPackagePluginValidation 2>&1 | tail -20 && exit 0
            echo "::warning::Package resolution attempt $attempt failed; retrying"
            rm -rf build/SourcePackages
            sleep $((attempt * 15))
          done
          echo "::error::Could not resolve Swift packages after 3 attempts"; exit 1
      - name: Build ${{ matrix.scheme }}
        working-directory: Encore
        run: |
          set -o pipefail
          ARCH_FLAGS=()
          if [ "${{ matrix.scheme }}" = "Encore-macOS" ]; then ARCH_FLAGS=(ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO); fi
          xcodebuild -project Encore.xcodeproj -scheme "${{ matrix.scheme }}" \
            -configuration Release -destination "${{ matrix.destination }}" \
            -derivedDataPath build -clonedSourcePackagesDirPath build/SourcePackages \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO "${ARCH_FLAGS[@]}" \
            -quiet build 2>&1 | tee build.log || { grep -E "error:" build.log | sort -u | head -30 | sed 's/^/::error::/'; tail -15 build.log | sed 's/^/::error::/'; exit 1; }
      - name: Verify universal Mac binary
        if: matrix.scheme == 'Encore-macOS'
        working-directory: Encore
        run: |
          APP=build/Build/Products/Release/Encore.app
          archs="$(lipo -archs "$APP/Contents/MacOS/Encore")"
          echo "Encore.app: $archs"
          [[ " $archs " == *" arm64 "* && " $archs " == *" x86_64 "* ]] || { echo "::error::not universal"; exit 1; }
          ditto -c -k --keepParent "$APP" Encore-macOS.zip
      - name: Mac updater end-to-end (real installer, real app)
        if: matrix.scheme == 'Encore-macOS'
        working-directory: Encore
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/updater"; rm -rf "$T"; mkdir -p "$T/Apps" "$T/staged"
          APP=build/Build/Products/Release/Encore.app
          codesign --force --deep --sign - "$APP"
          ditto "$APP" "$T/Apps/Encore.app"
          # The "update": the same app with a higher build number, signed like a release.
          ditto "$APP" "$T/staged/Encore.app"
          plutil -replace CFBundleVersion -string 9999 "$T/staged/Encore.app/Contents/Info.plist"
          codesign --force --deep --sign - "$T/staged/Encore.app"
          # The installer exactly as the app writes it.
          awk '/installerScript = #"""/{f=1;next} /^    """#/{f=0} f' App/Updates/MacUpdater.swift | sed 's/^    //' > "$T/install.sh"
          bash -n "$T/install.sh"
          sleep 2 & PID=$!
          bash "$T/install.sh" "$PID" "$T/staged/Encore.app" "$T/Apps/Encore.app" "$T/update.log" "$T/result" 9999
          cat "$T/update.log"
          test "$(cat "$T/result")" = "updated:9999"
          test "$(plutil -extract CFBundleVersion raw "$T/Apps/Encore.app/Contents/Info.plist")" = "9999"
          codesign --verify --deep --strict "$T/Apps/Encore.app"
          ls -A "$T/Apps"
          for _ in $(seq 1 30); do pgrep -f "$T/Apps/Encore.app/Contents/MacOS/Encore" >/dev/null && break; sleep 1; done
          pgrep -f "$T/Apps/Encore.app/Contents/MacOS/Encore" || { echo "::error::the updated app did not reopen"; exit 1; }
          pkill -f "$T/Apps/Encore.app/Contents/MacOS/Encore" || true
      - name: Upload Mac app
        if: matrix.scheme == 'Encore-macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Encore-macOS-universal
          path: Encore/Encore-macOS.zip
