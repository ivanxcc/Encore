name: Encore Relay

# Tests the relay (Encore/Relay) and publishes its Linux binaries and installer to the rolling
# `relay-latest` pre-release, which deploy/install.sh downloads from. Linux runners only: cheap.

on:
  push:
    branches: [beta]
    paths: ["Encore/Relay/**", ".github/workflows/encore-relay.yml"]
  pull_request:
    paths: ["Encore/Relay/**", ".github/workflows/encore-relay.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: encore-relay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  relay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Test
        working-directory: Encore/Relay
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
      - name: Build
        working-directory: Encore/Relay
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w" -o dist/encore-relay-linux-$arch ./cmd/encore-relay
          done
          cp deploy/install.sh dist/
          ls -la dist
      - name: Publish relay-latest
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release delete relay-latest -R "$REPO" --cleanup-tag --yes 2>/dev/null || true
          gh release create relay-latest -R "$REPO" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Encore Relay (latest build)" \
            --notes "The relay that prepares video for Encore Web. Install or update on a server: \`curl -fsSL https://github.com/${REPO}/releases/download/relay-latest/install.sh | sudo bash\`" \
            Encore/Relay/dist/*
