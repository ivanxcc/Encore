name: Encore Cloud

# Deploys the account-sync Worker (Encore/Cloud) to your Cloudflare account.
# One-time setup (see README "Turn on Encore Cloud"):
#   secrets  CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Then run this workflow once from the Actions tab. It creates the D1 database the first time,
# applies migrations, deploys, and prints the Worker URL to put in the ENCORE_CLOUD_URL variable.
# Afterwards it redeploys by itself whenever Encore/Cloud changes on main.

on:
  push:
    branches: [main, beta]
    paths: ["Encore/Cloud/**", ".github/workflows/encore-cloud.yml"]
  pull_request:
    paths: ["Encore/Cloud/**", ".github/workflows/encore-cloud.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: encore-cloud-${{ github.ref }}
  cancel-in-progress: false

env:
  WRANGLER: npx --yes wrangler@4.151.1

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Encore/Cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Encore/Cloud
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Encore Cloud is not set up (CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets missing). Skipping deploy."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - name: Find or create the D1 database
        if: env.SKIP != '1'
        run: |
          set -euo pipefail
          id="$($WRANGLER d1 list --json | jq -r '.[] | select(.name == "encore") | .uuid' | head -1)"
          if [ -z "$id" ]; then
            $WRANGLER d1 create encore
            id="$($WRANGLER d1 list --json | jq -r '.[] | select(.name == "encore") | .uuid' | head -1)"
          fi
          test -n "$id" || { echo "::error::Could not create the D1 database"; exit 1; }
          sed -i "s/__D1_DATABASE_ID__/${id}/" wrangler.toml
          echo "D1 database: $id"
      - name: Apply migrations
        if: env.SKIP != '1'
        run: $WRANGLER d1 migrations apply encore --remote
      - name: TMDB key (cast photos, 4K artwork, trending)
        if: env.SKIP != '1' && env.TMDB_API_KEY != ''
        run: |
          # The Worker must exist before it can hold a secret; the first deploy below creates it.
          $WRANGLER deploy >/dev/null
          printf '%s' "$TMDB_API_KEY" | $WRANGLER secret put TMDB_API_KEY
      - name: Deploy
        if: env.SKIP != '1'
        run: |
          set -euo pipefail
          $WRANGLER deploy 2>&1 | tee deploy.log
          url="$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1 || true)"
          if [ -n "$url" ]; then
            curl -fsS "$url/v1/health" && echo
            {
              echo "### Encore Cloud is live"
              echo ""
              echo "URL: \`$url\`"
              echo ""
              echo "Set the repository variable **ENCORE_CLOUD_URL** to that URL (Settings → Secrets and variables → Actions → Variables),"
              echo "then the next Encore release ships with sync turned on."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
